[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonogram-optimization"
version = "0.1.0"
description = "Metaheuristic optimization algorithms for Nonogram puzzles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
